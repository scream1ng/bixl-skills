<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} — PFC review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceeed;color:#20262c;font:14px Arial,sans-serif}header{padding:16px 24px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:18px}header strong{font-size:19px}header span{color:#64706b}button{font:inherit;border:1px solid #aeb6b2;border-radius:5px;background:white;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#a4470b;color:white}main{display:grid;grid-template-columns:minmax(600px,1fr) 300px;gap:20px;margin:22px}.sheet{background:#fff;padding:20px;overflow:auto}.sheet-title{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #222;padding-bottom:12px}.sheet-title img{max-width:95px;max-height:48px}.sheet-title h1{font-size:21px;margin:0;text-align:center}.details{display:flex;justify-content:space-between;padding:14px 0;gap:12px}.sheet table{width:100%;border-collapse:collapse;font-size:12px}.sheet th,.sheet td{border:1px solid #333;padding:8px 5px;vertical-align:middle}.sheet th{text-align:left}.sheet td:first-child{text-align:center}.sheet th:nth-child(n+5),.sheet td:nth-child(n+5){min-width:21px}.sheet td:nth-child(2){min-width:170px}.sheet td:nth-child(4){min-width:70px}.group{background:#f4f5f4;font-weight:bold}.commenting [data-check]{cursor:crosshair}.commenting tr[data-check]:hover{background:#fff0df}.drawing{position:relative;border:1px solid #333;border-top:0;min-height:160px}.drawing svg{width:100%;height:auto;display:block}.commenting .drawing{cursor:crosshair}.pin{position:absolute;transform:translate(-50%,-50%);background:#a4470b;color:#fff;border:2px solid #fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:12px;pointer-events:none}.footer{display:flex;justify-content:space-between;border:1px solid #333;border-top:0;padding:10px}aside{background:#fff;border:1px solid #d9dedb;padding:16px;align-self:start}aside h2{font-size:17px;margin-top:0}aside p{line-height:1.5;color:#56605b}.note{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}.note small{color:#6b746f}.note button{float:right;padding:2px 6px}textarea{width:100%;min-height:110px;font:inherit;padding:8px;resize:vertical}#editor{margin-top:15px}#exported{min-height:140px}#status{font-size:12px}#notice:empty{display:none}#notice{color:#87430e}@media(max-width:1000px){main{grid-template-columns:1fr;margin:12px}.sheet{padding:12px}header{flex-wrap:wrap}}@media print{header,aside{display:none}main{display:block;margin:0}.sheet{padding:0}.pin{display:none}}

.sheet{position:relative}#pins{position:absolute;inset:0;pointer-events:none;z-index:10}.pin{position:absolute;pointer-events:auto;transform:none;width:auto;height:auto;display:block;background:none;border:0;z-index:1}.pin:focus-within{z-index:2}.pin .marker{position:absolute;left:-13px;top:-30px;width:28px;height:28px;border-radius:50% 50% 50% 3px;background:#e31837;color:#fff;border:0;padding:0;font-weight:bold;box-shadow:0 2px 7px #0005;transform:rotate(-45deg)}.marker span{display:block;transform:rotate(45deg)}.pin .box{position:absolute;left:16px;bottom:8px;width:210px;background:#fff;border-radius:9px;box-shadow:0 3px 14px #0004;padding:8px}.pin textarea{width:100%;min-height:60px;height:65px;font:12px Arial,sans-serif;border:1px solid #bbb;border-radius:5px}.pin .target{display:block;font-size:11px;color:#555;padding-bottom:5px}.pin .del{padding:3px 6px;font-size:11px}.pin.shut .box{display:none}.pin.flip .box{left:auto;right:16px}.pin.below .box{bottom:auto;top:12px}#notes{font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}button[aria-pressed=true]{background:#e31837;border-color:#e31837;color:#fff}@media print{#pins{display:none}}

/* Embedded hosts can impose button colours independently of the document body. */
button{color:#20262c!important;-webkit-text-fill-color:#20262c!important;opacity:1;font-family:Arial,sans-serif}.icl-controls #mode{color:#fff!important;-webkit-text-fill-color:#fff!important;background:#e31837;border-color:#e31837;font-weight:600}.icl-controls #mode[aria-pressed=true]{background:#20262c;border-color:#20262c;box-shadow:0 0 0 2px #e31837}.pin .marker,.pin .marker span{color:#fff!important;-webkit-text-fill-color:#fff!important}

.icl-controls{position:sticky;top:22px;max-height:calc(100vh - 44px);overflow:auto;border-radius:12px;box-shadow:0 3px 16px #0001}.review-heading{display:flex;flex-direction:column;gap:6px;border-bottom:1px solid #d9dedb;padding-bottom:14px;margin-bottom:16px}.review-heading strong{font-size:19px;color:#20262c}.review-heading span{font-size:12px;color:#64706b}.review-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.review-actions #mode{flex:1}.review-actions #copy{flex:1;font-size:12px;padding:8px 6px}@media(max-width:1000px){.icl-controls{position:static;max-height:none;grid-row:1}}@media print{.icl-controls{display:none}}
@page{size:A4 portrait;margin:10mm}@media print{.sheet table{font-size:10pt}.sheet th,.sheet td{padding:3px}.drawing svg{max-height:245mm}}
.pfc-details{line-height:1.7;padding:12px 0;font-size:13px}.pfc-source{padding:10px 0;color:#666;font-size:11px}.drawing{border:0}.sheet{max-width:1050px}.drawing svg{max-width:100%;height:auto}.commenting .drawing [data-check]{cursor:crosshair}.commenting .drawing rect[data-check]:hover{fill:#fff0df}.sheet-title h1{font-size:20px}@media print{.pfc-source{display:none}.sheet{max-width:none}.pfc-details{font-size:10pt}}
#status:empty{display:none}.review-notes{border-top:1px solid #ddd;padding-top:12px;font-size:12px}.review-notes strong{font-size:12px}.review-notes ul{margin:8px 0 0;padding-left:17px;line-height:1.5}.review-notes li+li{margin-top:6px}#notes[hidden]{display:none}#notes{font:13px Arial,sans-serif;line-height:1.5}
</style>

<main><section class="sheet"><div id="pins" aria-label="Comment pins"></div><div class="sheet-title"><img id="logo" src="{{LOGO}}" alt="IXL logo"><h1>PROCESS FLOW CHART</h1><span>Rev {{REVISION}}</span></div><div class="pfc-details">{{HEADER}}</div><div class="drawing" id="drawing">{{DRAWING}}</div><div class="pfc-source">{{SOURCE_NOTE}}</div></section>
<aside class="icl-controls" aria-label="PFC review and comments"><div class="review-heading"><strong>Draft PFC</strong><span>{{PART}} · Revision {{REVISION}}</span></div><div class="review-actions"><button id="mode" aria-pressed="false">Comment mode</button><button id="copy">Copy comments</button></div><p id="status" role="status"></p>{{REVIEW_NOTES}}<pre id="notes" hidden></pre><textarea id="exported" aria-label="Comments to copy" hidden readonly></textarea></aside></main>
<script>
const meta={{META}};
{{COMMENTS_SCRIPT}}
</script></html>
