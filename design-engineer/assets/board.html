<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{--bg:#ededed;--paper:#fff;--ink:#171717;--muted:#626262;--line:#d6d6d6;--accent:#e31837}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}main{max-width:1440px;margin:auto;padding:24px}section{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:24px}h1,h2{font-size:22px;margin:0}h4{margin:18px 0 6px;font-size:13px}.heading{padding:22px 26px}.meta,.hint{color:var(--muted);font-size:12px;margin:5px 0 0}.hint{padding:12px 26px}.recommendation{margin:20px 26px;padding:12px 16px;border-left:3px solid var(--accent);background:#f5f5f5}iframe{display:block;width:100%;height:740px;border:0;border-block:1px solid var(--line)}.review-images,.visuals{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.review-images{padding:0 26px 24px}iframe+.review-images{padding-top:24px}figure{margin:0;min-width:0}figure img{display:block;width:100%;max-height:640px;object-fit:contain;background:#f3f3f3;border-radius:4px}figcaption{font-size:12px;color:var(--muted);margin-top:6px}.basis{display:inline-block;border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:10px;font-weight:normal}.elements{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start;padding:0 26px 26px}.element{border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0;scroll-margin-top:20px}.element:hover,.element[open]{border-color:var(--accent)}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.element summary{display:grid;grid-template-columns:38px minmax(0,1fr) 20px;gap:10px;padding:16px;align-content:start}.snapshot{grid-column:1/-1;display:block;height:210px;background:#f3f3f3;border-radius:4px;overflow:hidden}.snapshot img{width:100%;height:100%;object-fit:contain}.eid{grid-column:1;color:var(--accent);font-size:12px;font-weight:bold;padding:6px;border:1px solid var(--line);text-align:center}.element-name{grid-column:2;font-weight:bold;min-height:65px}.element-name small{display:block;margin-top:4px;font-weight:normal;font-size:12px;color:var(--muted)}.plus{grid-column:3;font-size:23px;line-height:1}.element[open] .plus{transform:rotate(45deg)}.evidence,.status{grid-column:1/-1}.status{font-size:11px;color:var(--muted);border-top:1px solid #eee;padding-top:8px}.element-detail{padding:0 16px 18px;border-top:1px solid #eee;font-size:13px}.element-detail .visuals{grid-template-columns:minmax(0,1fr);margin-top:16px}.element-detail button{margin:12px 5px 0 0}button{font:inherit;cursor:pointer;border:1px solid var(--line);padding:7px 10px;background:#fff;border-radius:4px;font-size:12px}button:hover{border-color:var(--accent)}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.zoom-image{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}.comparison{padding:0 26px 20px}.element-detail .comparison{padding:16px 0 0}.comparison p{font-size:12px;color:var(--muted)}section>ul{margin:0 26px 22px}.element-detail ul{padding-left:18px}.table-wrap{overflow-x:auto;padding:0 26px 24px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f3f3f3}td:first-child{white-space:nowrap;font-weight:bold}.board-history>summary{padding:0 26px 20px;font-size:13px}.board-history>summary::after{content:' +';color:var(--accent)}dialog{padding:12px;border:0;border-radius:6px;max-width:96vw;max-height:96vh}dialog::backdrop{background:#000b}dialog img{display:block;max-width:90vw;max-height:82vh}dialog button{float:right;margin-bottom:8px}@media(max-width:1050px){.elements{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){main{padding:12px}.heading{padding:18px}.elements{grid-template-columns:minmax(0,1fr);padding:0 18px 18px}.review-images,.table-wrap{padding-inline:18px}.review-images,.visuals{grid-template-columns:minmax(0,1fr)}iframe{height:650px}.snapshot{height:230px}h1,h2{font-size:20px}}
</style></head><body><main>__BODY__</main><dialog id="zoom"><button id="close-zoom">Close ×</button><img alt=""></dialog>
<script>
const zoom=document.querySelector('#zoom'),frame=document.querySelector('#model');
function enlarge(img){zoom.querySelector('img').src=img.src;zoom.querySelector('img').alt=img.alt;zoom.showModal();}
for(const button of document.querySelectorAll('.zoom-image'))button.onclick=()=>enlarge(button.querySelector('img'));
for(const button of document.querySelectorAll('.enlarge-snapshot'))button.onclick=()=>enlarge(button.closest('.element').querySelector('.snapshot img'));
document.querySelector('#close-zoom').onclick=()=>zoom.close();zoom.onclick=e=>{if(e.target===zoom)zoom.close();};
for(const button of document.querySelectorAll('.locate')){button.hidden=!frame;button.onclick=()=>{frame.contentWindow.postMessage({type:'focus-element',id:button.dataset.element},'*');document.querySelector('#review').scrollIntoView({behavior:'smooth'});};}
addEventListener('message',e=>{if(!frame||e.source!==frame.contentWindow||e.data?.type!=='open-element')return;const el=document.getElementById(e.data.id);if(el?.classList.contains('element')){el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'});}});
</script></body></html>
