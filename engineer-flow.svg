<svg xmlns="http://www.w3.org/2000/svg" width="980" height="200" viewBox="0 0 980 200" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8b949e"/></marker>
  </defs>
  <g fill="#f6f8fa" stroke="#57606a">
    <rect x="10" y="20" width="110" height="48" rx="4"/>
    <rect x="150" y="20" width="200" height="48" rx="4"/>
    <rect x="380" y="20" width="230" height="48" rx="4"/>
    <rect x="640" y="20" width="210" height="48" rx="4"/>
    <rect x="880" y="20" width="90" height="48" rx="4"/>
  </g>
  <g fill="#24292f" text-anchor="middle">
    <text x="65" y="49">Images / STEP</text>
    <text x="250" y="41">1 · Requirements</text>
    <text x="250" y="57" fill="#57606a" font-size="12">one round, with recommendations</text>
    <text x="495" y="41">2 · Proposal board</text>
    <text x="495" y="57" fill="#57606a" font-size="12">complete in one pass</text>
    <text x="745" y="41">3 · CAD delivery</text>
    <text x="745" y="57" fill="#57606a" font-size="12">autonomous</text>
    <text x="925" y="49">Deliver</text>
  </g>
  <g fill="#57606a" font-size="12">
    <text x="250" y="96" text-anchor="middle">follow-up only if it changes the design</text>
    <text x="495" y="96" text-anchor="middle">internal: preliminary CAD, every position,</text>
    <text x="495" y="111" text-anchor="middle">layout, motion and process checks</text>
    <text x="745" y="96" text-anchor="middle">internal: blockout → structure → detail,</text>
    <text x="745" y="111" text-anchor="middle">assembly, process and export checks</text>
    <text x="745" y="126" text-anchor="middle">pause only for a blocker or departure</text>
    <text x="495" y="172" text-anchor="middle">concept = appearance · CAD = checked geometry · physical validation listed separately</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M120,44H150"/>
    <path d="M350,44H380"/>
    <path d="M610,44H640"/>
    <path d="M850,44H880"/>
  </g>
  <g stroke="#8b949e" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#a)">
    <path d="M440,20V8H550V20"/>
  </g>
  <g fill="#8b949e" font-size="12">
    <text x="625" y="16" text-anchor="middle">approved</text>
    <text x="434" y="14" text-anchor="end">revise</text>
  </g>
</svg>
