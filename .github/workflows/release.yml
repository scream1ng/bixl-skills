# Release without local gh: push .github/release-requests/<skill>-<version>.md (contents = notes),
# or run manually. Builds the same zip and tag as release.sh; existing releases are skipped.
name: release
on:
  push:
    branches: [main]
    paths: ['.github/release-requests/*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in .github/release-requests/*.md; do
            tag=$(basename "$f" .md); skill=${tag%-v*}; version=${tag##*-}
            gh release view "$tag" >/dev/null 2>&1 && continue
            [ -f "$skill/SKILL.md" ] || { echo "no skill folder for $tag" >&2; exit 1; }
            (cd "$skill" && zip -qr "$RUNNER_TEMP/$tag.zip" . -x '*__pycache__*' '*.pyc' '*.DS_Store' '*.fixture-cache*')
            gh release create "$tag" "$RUNNER_TEMP/$tag.zip" --target "$GITHUB_SHA" --title "$skill $version" --notes-file "$f"
          done
