<div id="fixture-preview"><div class="fixture-view"></div><div class="fixture-groups"></div><div class="fixture-failure"></div></div>
<style>
#fixture-preview{position:relative;width:100%;height:720px;overflow:hidden;background:#e8edf2;font:13px system-ui;color:#152a38}#fixture-preview .fixture-view{position:absolute;inset:0}#fixture-preview .fixture-groups{position:absolute;top:12px;left:12px;display:flex;gap:6px;padding:7px 9px;background:#fffe;border-radius:8px;box-shadow:0 2px 10px #1232}#fixture-preview label{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none}#fixture-preview input{margin:0}#fixture-preview .fixture-failure{display:none;position:absolute;inset:12px auto auto 12px;max-width:360px;padding:10px;background:#fff;color:#873700;border-radius:8px}#fixture-preview canvas{display:block}@media(max-width:700px){#fixture-preview{height:650px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script class="fixture-scene-data" type="application/octet-stream">__SCENE_GZIP_BASE64__</script>
<script type="module">
try {
const root=document.querySelector('#fixture-preview'),view=root.querySelector('.fixture-view'),groups=root.querySelector('.fixture-groups');
const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const packed=Uint8Array.from(atob(root.querySelector('.fixture-scene-data').textContent.trim()),c=>c.charCodeAt(0));
const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
const data=JSON.parse(await new Response(stream).text());
const scene=new THREE.Scene();scene.background=new THREE.Color('#e8edf2');
const size=()=>[Math.max(root.clientWidth,1),Math.max(root.clientHeight,1)];let [width,height]=size();
const camera=new THREE.PerspectiveCamera(40,width/height,.1,100000);camera.up.set(0,0,1);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(width,height);view.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x506070,2.3));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(-1,-2,4);scene.add(light);
const colors={workpiece:0xddaa55,fixture:0x377994,hardware:0xba6262},meshes=[],groupOn={workpiece:true,fixture:true,hardware:true};
function visibility(){for(const mesh of meshes)mesh.visible=groupOn[mesh.userData.group];}
for(const component of data.components){const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(component.positions,3));geometry.setIndex(component.indices);geometry.computeVertexNormals();const material=new THREE.MeshStandardMaterial({color:colors[component.group],roughness:.65,metalness:.12,side:THREE.DoubleSide});const mesh=new THREE.Mesh(geometry,material);mesh.userData.group=component.group;scene.add(mesh);meshes.push(mesh);}
for(const group of Object.keys(groupOn)){if(!meshes.some(mesh=>mesh.userData.group===group))continue;const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=true;input.onchange=()=>{groupOn[group]=input.checked;visibility();};label.append(input,document.createTextNode(group[0].toUpperCase()+group.slice(1)));groups.append(label);}
const bounds=new THREE.Box3();for(const mesh of meshes)bounds.expandByObject(mesh);const center=bounds.getCenter(new THREE.Vector3()),modelSize=bounds.getSize(new THREE.Vector3());const radius=Math.max(modelSize.x,modelSize.y,modelSize.z,1)*1.9;controls.target.copy(center);camera.near=Math.max(radius/10000,.001);camera.far=radius*100;camera.updateProjectionMatrix();
camera.position.copy(center).add(new THREE.Vector3(1,-1,1).normalize().multiplyScalar(radius));controls.target.copy(center);controls.update();
new ResizeObserver(()=>{[width,height]=size();camera.aspect=width/height;camera.updateProjectionMatrix();renderer.setSize(width,height);}).observe(root);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}animate();
}catch(error){const failure=document.querySelector('#fixture-preview .fixture-failure');failure.textContent='3D preview unavailable: '+error.message;failure.style.display='block';}
</script>
